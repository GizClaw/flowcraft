name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used for generated release PR validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute module matrix
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.matrix.outputs.lint }}
      lint_enabled: ${{ steps.matrix.outputs.lint_enabled }}
      test: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build module matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          python3 - <<'PY' > matrix.json
          import json, os, pathlib, re, subprocess

          def module_dirs():
              dirs = ["core", "examples/forge"]
              for base in ("backends", "driver"):
                  for path in pathlib.Path(base).rglob("go.mod"):
                      if "vendor" in path.parts or "testdata" in path.parts:
                          continue
                      dirs.append(str(path.parent))
              return sorted(set(dirs))

          dirs = module_dirs()
          # examples/forge stays out of the lint gate.
          lint_dirs = [d for d in dirs if d != "examples/forge"]

          # Parse each in-workspace module's identity and its requires on
          # other flowcraft modules so a change can pull in every module
          # that (transitively) depends on it.
          path_of = {}
          deps_of = {}
          for d in dirs:
              text = pathlib.Path(d, "go.mod").read_text()
              mod = re.search(r"(?m)^module\s+(\S+)", text).group(1)
              path_of[d] = mod
              deps_of[d] = set(re.findall(
                  r"(?m)^\s*(?:require\s+)?(github\.com/GizClaw/flowcraft/[\w./-]+)\s+v\S+",
                  text,
              ))
          dir_of = {path: d for d, path in path_of.items()}
          reverse = {d: set() for d in dirs}
          for d, deps in deps_of.items():
              for dep in deps:
                  if dep in dir_of:
                      reverse[dir_of[dep]].add(d)

          base = os.environ["BASE_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              text=True,
          ).splitlines()

          changed = set()
          root_trigger = False
          root_trigger_files = {
              "go.work",
              "go.mod",
              "go.sum",
              "Makefile",
              ".golangci.yml",
          }
          prefixes = sorted(dirs, key=len, reverse=True)

          for file in files:
              if file in root_trigger_files:
                  root_trigger = True
                  continue
              for d in prefixes:
                  if file == d or file.startswith(d + "/"):
                      changed.add(d)
                      break

          def reverse_closure(seeds):
              out = set(seeds)
              stack = list(seeds)
              while stack:
                  d = stack.pop()
                  for dep in reverse[d]:
                      if dep not in out:
                          out.add(dep)
                          stack.append(dep)
              return out

          lint = lint_dirs if root_trigger else sorted(changed & set(lint_dirs))
          # examples/forge pins released module versions and builds with
          # GOWORK=off, so it always runs rather than joining the closure.
          test = sorted(reverse_closure(changed)) if not root_trigger else sorted(dirs)
          test = sorted(set(test) | {"examples/forge"})
          json.dump(
              {"lint": {"module": lint}, "test": {"module": test}},
              open("matrix.json", "w"),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"lint_enabled={'true' if lint else 'false'}\n")
          PY
          echo "lint=$(jq -c .lint matrix.json)" >> "$GITHUB_OUTPUT"
          echo "test=$(jq -c .test matrix.json)" >> "$GITHUB_OUTPUT"

  release-intent:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Test release gate tooling
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go test -count=1 -race ./...

      - name: Validate immutable changesets
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: go run . validate --repo ../.. --base "$BASE_SHA"

      - name: Validate pending release plan
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . plan --repo ../..

      - name: Validate planned module pins and tidiness
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . preflight --repo ../..

      - name: Validate generated release changelog
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'automation/release-changelog'
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . changelog --repo ../.. --check

  gofmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt -s check
        run: |
          diff=$(gofmt -s -l core driver examples/forge tools)
          if [ -n "$diff" ]; then
            echo "Files not formatted:"
            echo "$diff"
            exit 1
          fi

  check-consumers:
    name: Consumers build outside the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Every example is read the way a reader reads it: its own go.mod
      # and go.sum, no workspace. The target also
      # checks that an exemption in CONSUMER_EXEMPT is still needed — a
      # module that starts building here turns this lane red instead of
      # leaving a stale exemption behind. See the Makefile.
      - name: Check consumers
        run: make check-consumers

  lint:
    name: Lint (${{ matrix.module }})
    needs: [compute-matrix]
    if: needs.compute-matrix.outputs.lint_enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.lint) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --new-from-rev=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # The config in .github/actionlint.yaml makes the workflow files
      # self-checking: a wrong expression or a missing needs entry fails here.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # Working-tree scan: a pull request checkout has no history to scan, and
      # a secret committed in this PR is still in the tree.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --no-git --redact --verbose
      # The config lives at the repository root: the CLI only accepts its own
      # file names, so a path under .github/ is rejected before anything is
      # linted (which is what this lane did: fail, never run).
      #
      # The globs are here rather than in the config because the action passes
      # them on the command line, where they win. `CHANGELOG.md` is generated
      # from changeset summaries whose prose is not written as Markdown (a
      # summary naming `backends/*` reads as emphasis), so this lane lints what
      # is authored and the generator owns its own output.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            docs/**/*.md
      # A module that needs a tidy is a module whose go.mod no longer describes
      # its imports; the release gate rejects that state, so catch it earlier.
      #
      # `in_flight` names the modules whose code already imports packages this
      # branch adds while their go.mod still pins the previous `core` tag. Tidy
      # resolves against the tag, not the workspace, so it cannot be clean
      # until the pin moves with the release. Each entry is checked as a
      # claim: a module that tidies cleanly, or fails for any reason other than
      # that pin, fails this lane, so the list cannot outlive its reason.
      - name: go mod tidy
        run: |
          set -e
          in_flight="examples/forge driver"
          for d in core examples/forge driver; do
            echo "==> $d"
            case " $in_flight " in
              *" $d "*)
                out=$( cd "$d" && go mod tidy -diff 2>&1 ) && {
                  msg="error: $d is tidy outside the workspace now"
                  echo "$msg; drop it from in_flight" >&2
                  exit 1
                }
                case "$out" in
                  *"does not contain package"* | *"missing go.sum entry"*) ;;
                  *)
                    echo "$out" >&2
                    exit 1
                    ;;
                esac
                echo "    in flight: its pin moves with the core release"
                ;;
              *) ( cd "$d" && go mod tidy -diff ) ;;
            esac
          done

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # A short fixed budget per target: enough to catch a panic on an edge
      # input, not a real hunt (FUZZTIME extends it locally).
      - run: FUZZTIME=15s tools/fuzz.sh

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # One iteration per benchmark: enough to prove every benchmark compiles,
      # runs and reports, which is exactly what a signature change or a moved
      # fixture breaks silently. Numbers are not compared here — timings on a
      # shared runner vary enough that a threshold would be noise; the
      # allocation guards in the unit tests are the deterministic gate.
      - run: make bench-check

  test-shuffle:
    name: Shuffle (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Order-dependent tests are invisible under the default order; three
      # shuffled runs are cheap and catch shared state in the table and the
      # stores.
      - run: go test -shuffle=on -count=3 ./...
        working-directory: core

  test:
    name: Test (${{ matrix.module }})
    needs: compute-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@v4
      # The floor is 1.26 and the patch is pinned, not floated: govulncheck
      # below reports the standard library of the toolchain it runs on. The
      # 2026-10-08 batch is fixed in 1.26.9 (and 1.27.2) with no 1.25 release;
      # GO-2026-6809 (a crypto/x509 intermediate denylist) in 1.26.10 (and
      # 1.27.3). Both the runner image and the setup-go manifest lag fresh
      # releases, so the pin, not the image, is what decides which stdlib the
      # scan reads. The other lanes keep the floating minor: no verdict of
      # theirs depends on the patch. Bump this pin when a security release
      # lands; the scan reddening on the previous patch is the reminder.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: ${{ matrix.module }}
      # The driver module is consumed outside this workspace — by deployments,
      # by the examples — where its own go.mod and go.sum are the whole story.
      # The release workflow gates the planned modules with
      # GOWORK=off, but a driver tag is not part of a planned release, so
      # nothing checked the driver's pin or tidiness before it shipped. Build it
      # the way a consumer does: a missing symbol or a short go.sum would
      # otherwise fail the first deployment of the next tag under -mod=readonly.
      - name: Build with GOWORK=off
        if: startsWith(matrix.module, 'driver')
        env:
          GOWORK: "off"
        working-directory: ${{ matrix.module }}
        run: |
          # The requirement moves with the core release. Until `core` tags the
          # rebuild this module imports packages its pin does not contain, so a
          # failure that names the pin is the expected state and a failure that
          # names anything else is a real one. Delete this guard with the bump.
          steps() { go mod tidy -diff && go build ./... && go vet ./...; }
          if out=$(steps 2>&1); then
            echo "$out"
            exit 0
          fi
          case "$out" in
            *"does not contain package"* | *"missing go.sum entry"*)
              echo "$out" | head -3
              echo "==> in flight: the core pin moves with the release"
              ;;
            *)
              echo "$out"
              exit 1
              ;;
          esac
      # core/sandbox and the backends carry per-GOOS files the linux lane
      # never compiles, so
      # a darwin syscall or an other-unix stub can be wrong or stop building
      # without any check going red. Cross-compile them here: same runner,
      # no extra cost.
      - name: Vet the unix variants
        if: matrix.module == 'core'
        run: |
          GOOS=darwin go vet ./...
          GOOS=freebsd go vet ./...
        working-directory: ${{ matrix.module }}
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          # govulncheck builds the module in module mode, so the driver's pin
          # makes it unresolvable for the same reason the lane above is guarded.
          # A scan that cannot build proves nothing; say so instead of reddening
          # the lane, and delete this guard with the pin bump.
          if out=$(go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1); then
            echo "$out"
            exit 0
          fi
          case "$out" in
            *"does not contain package"* | *"missing go.sum entry"* | *undefined:* | *"cannot find module"*)
              echo "$out" | head -3
              echo "==> in flight: the core pin moves with the release"
              ;;
            *)
              echo "$out"
              exit 1
              ;;
          esac

  test-sandbox-bwrap:
    name: Integration core/sandbox-bwrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install bubblewrap
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1; then
            echo "bwrap already present: $(command -v bwrap)"
            bwrap --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      # Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, which leaves bubblewrap failing with "setting up uid
      # map: Permission denied" before it can mount anything (the runner
      # image ships, but does not load, the profile that allows it). The
      # journal integration tests below need a real namespace, so make
      # one available and prove it.
      - name: Make bubblewrap usable
        run: |
          set -euo pipefail
          # A fresh mount namespace starts with an empty root, so the
          # probe binds the host root read-only exactly like the
          # runner's own filesystem flags do: without that, bwrap fails
          # on a missing /bin/true before it ever reaches the namespace
          # setup under test.
          probe_log=$(mktemp)
          probe() {
            bwrap --ro-bind / / --unshare-pid --die-with-parent -- /bin/true 2>"$probe_log"
          }
          report() { sed 's/^/  /' "$probe_log"; }

          if probe; then
            echo "bwrap can create a namespace"
            exit 0
          fi
          echo "bwrap cannot create a namespace:"
          report

          # The profile the bubblewrap package ships re-allows exactly
          # bwrap's own user-namespace creation; write it when the
          # installed package predates the profile, then reload.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap || true
          if probe; then
            echo "bwrap works with the AppArmor profile loaded"
            exit 0
          fi
          echo "still failing with the profile loaded:"
          report

          # Hosts whose AppArmor has nothing to load take the blunt
          # route: lift the restriction for this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if probe; then
            echo "bwrap works with the unprivileged-userns restriction lifted"
            exit 0
          fi
          echo "bwrap still cannot create a namespace:"
          report
          exit 1
      - name: Test
        run: |
          go test -tags=integration_bwrap -count=1 -timeout 180s \
            ./sandbox-bwrap/...
        working-directory: core

  test-core-windows:
    name: Test core (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build
        working-directory: core
        run: go build ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test -count=1 ./...

  test-sandbox-windows:
    name: Integration core/sandbox-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Test
        working-directory: core
        run: go test -count=1 -timeout 180s ./sandbox-windows/...

  test-sandbox-macos:
    name: Integration core/sandbox + seatbelt (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # The kqueue source, the cross-backend journal contract suite and
      # the seatbelt backend only run where the platform primitives
      # exist; the cross-vet lanes prove they compile, this proves they
      # work — under the race detector, because this is the only lane
      # that executes the kqueue source and its leaf watches. sandbox-exec
      # ships with macOS, so nothing is installed.
      - name: Test
        working-directory: core
        run: |
          go test -count=1 -race -timeout 300s \
            ./sandbox/... ./sandbox-local/... ./sandbox-seatbelt/...

  ci-pass:
    name: CI
    if: always()
    needs:
      - release-intent
      - gofmt
      - check-consumers
      - compute-matrix
      - lint
      - hygiene
      - fuzz
      - test-shuffle
      - bench
      - test
      - test-sandbox-bwrap
      - test-core-windows
      - test-sandbox-windows
      - test-sandbox-macos
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=( \
            "${{ needs.release-intent.result }}" \
            "${{ needs.gofmt.result }}" \
            "${{ needs.check-consumers.result }}" \
            "${{ needs.compute-matrix.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.hygiene.result }}" \
            "${{ needs.fuzz.result }}" \
            "${{ needs.test-shuffle.result }}" \
            "${{ needs.bench.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-sandbox-bwrap.result }}" \
            "${{ needs.test-core-windows.result }}" \
            "${{ needs.test-sandbox-windows.result }}" \
            "${{ needs.test-sandbox-macos.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
