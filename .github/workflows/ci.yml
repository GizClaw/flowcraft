name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used for generated release PR validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      drivers: ${{ steps.filter.outputs.drivers }}
      integrations: ${{ steps.filter.outputs.integrations }}
      memory: ${{ steps.filter.outputs.memory }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            drivers:
              - 'driver/**'
            integrations:
              - 'integrations/**'
            memory:
              - 'memory/**'
            ci:
              - '.github/workflows/**'
              - '.release/**'
              - '.golangci.yml'
              - 'Makefile'
              - 'tools/releasegate/**'

  release-intent:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Test release gate tooling
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go test -count=1 -race ./...

      - name: Validate immutable changesets
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: go run . validate --repo ../.. --base "$BASE_SHA"

      - name: Validate pending release plan
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . plan --repo ../..

      - name: Validate generated release changelog
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'automation/release-changelog'
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . changelog --repo ../.. --check

  gofmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt -s check
        run: |
          diff=$(gofmt -s -l core driver integrations memory memory/eval examples/forge)
          if [ -n "$diff" ]; then
            echo "Files not formatted:"
            echo "$diff"
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.module }})
    needs: detect
    if: needs.detect.outputs.core == 'true' || needs.detect.outputs.drivers == 'true' || needs.detect.outputs.integrations == 'true' || needs.detect.outputs.memory == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - core
          - driver/openai
          - driver/deepseek
          - driver/azure
          - driver/anthropic
          - driver/minimax
          - driver/qwen
          - driver/kimi
          - driver/bytedance
          - integrations/sqlite
          - integrations/objstore
          - integrations/sandbox
          - memory
          - memory/eval
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --new-from-rev=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - core
          - driver/openai
          - driver/deepseek
          - driver/azure
          - driver/anthropic
          - driver/minimax
          - driver/qwen
          - driver/kimi
          - driver/bytedance
          - integrations/sqlite
          - integrations/objstore
          - integrations/sandbox
          - memory
          - memory/eval
          - examples/forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: ${{ matrix.module }}

  test-sandbox-bwrap:
    name: Integration integrations/sandbox/bwrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install bubblewrap
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1; then
            echo "bwrap already present: $(command -v bwrap)"
            bwrap --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: Test
        run: go test -tags=integration_bwrap -count=1 -timeout 180s ./bwrap/...
        working-directory: integrations/sandbox

  ci-pass:
    name: CI
    if: always()
    needs: [release-intent, gofmt, lint, test, test-sandbox-bwrap]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=( \
            "${{ needs.release-intent.result }}" \
            "${{ needs.gofmt.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-sandbox-bwrap.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
