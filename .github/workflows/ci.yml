name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used for generated release PR validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute module matrix
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.matrix.outputs.lint }}
      lint_enabled: ${{ steps.matrix.outputs.lint_enabled }}
      test: ${{ steps.matrix.outputs.test }}
      test_enabled: ${{ steps.matrix.outputs.test_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build module matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          python3 - <<'PY' > matrix.json
          import json, os, pathlib, re, subprocess

          def module_dirs():
              # One entry per module the checkout builds. The three implementation
              # modules are siblings of core, not packages inside it; a provider or a
              # backend is a package there, so the list does not recurse.
              return sorted({"core", "sandbox", "inference", "agent", "tool", "test/e2e", "examples/forge"})

          dirs = module_dirs()
          # The lint gate skips a module that is built the way a reader builds it:
          # examples/forge pins a released core and is compiled with GOWORK=off by the
          # test job instead.
          lint_dirs = [d for d in dirs if d != "examples/forge"]

          # Parse each in-workspace module's identity and its requires on
          # other flowcraft modules so a change can pull in every module
          # that (transitively) depends on it.
          path_of = {}
          deps_of = {}
          for d in dirs:
              text = pathlib.Path(d, "go.mod").read_text()
              mod = re.search(r"(?m)^module\s+(\S+)", text).group(1)
              path_of[d] = mod
              deps_of[d] = set(re.findall(
                  r"(?m)^\s*(?:require\s+)?(github\.com/GizClaw/flowcraft/[\w./-]+)\s+v\S+",
                  text,
              ))
          dir_of = {path: d for d, path in path_of.items()}
          # A consumer pins released module versions and is built outside this
          # workspace (see `check-consumers`), so it is not a dependent of the
          # working tree: a change to a module it requires at a tag cannot reach
          # it. It joins the matrix only when its own files change.
          # A consumer pins released versions and is built outside this workspace.
          consumers = {d for d in dirs if d.startswith("examples/")}
          reverse = {d: set() for d in dirs}
          for d, deps in deps_of.items():
              if d in consumers:
                  continue
              for dep in deps:
                  if dep in dir_of:
                      reverse[dir_of[dep]].add(d)

          base = os.environ["BASE_SHA"]
          files = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              text=True,
          ).splitlines()

          changed = set()
          root_trigger = False
          root_trigger_files = {
              "go.work",
              "go.mod",
              "go.sum",
              "Makefile",
              ".golangci.yml",
          }
          prefixes = sorted(dirs, key=len, reverse=True)

          for file in files:
              if file in root_trigger_files:
                  root_trigger = True
                  continue
              for d in prefixes:
                  if file == d or file.startswith(d + "/"):
                      changed.add(d)
                      break

          def reverse_closure(seeds):
              out = set(seeds)
              stack = list(seeds)
              while stack:
                  d = stack.pop()
                  for dep in reverse[d]:
                      if dep not in out:
                          out.add(dep)
                          stack.append(dep)
              return out

          lint = lint_dirs if root_trigger else sorted(changed & set(lint_dirs))
          test = sorted(reverse_closure(changed)) if not root_trigger else sorted(dirs)
          # The workspace mode travels with the entry: a consumer is built the
          # way a reader builds it, outside this workspace.
          json.dump(
              {
                  "lint": {"module": lint},
                  "test": {
                      "include": [
                          {
                              "module": d,
                              "gowork": "off" if d in consumers else "auto",
                          }
                          for d in test
                      ]
                  },
              },
              open("matrix.json", "w"),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"lint_enabled={'true' if lint else 'false'}\n")
              # `include: []` is a matrix with no entries, which the runner
              # refuses rather than treating as "nothing to do": a docs-only
              # change selects no module, and that job must be skipped.
              output.write(f"test_enabled={'true' if test else 'false'}\n")
          PY
          echo "lint=$(jq -c .lint matrix.json)" >> "$GITHUB_OUTPUT"
          echo "test=$(jq -c .test matrix.json)" >> "$GITHUB_OUTPUT"

  release-intent:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Test release gate tooling
        working-directory: scripts/releasegate
        env:
          GOWORK: "off"
        run: go test -count=1 -race ./...

      - name: Validate immutable changesets
        working-directory: scripts/releasegate
        env:
          GOWORK: "off"
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: go run . validate --repo ../.. --base "$BASE_SHA"

      - name: Validate pending release plan
        working-directory: scripts/releasegate
        env:
          GOWORK: "off"
        run: go run . plan --repo ../..

      - name: Validate planned module pins and tidiness
        working-directory: scripts/releasegate
        env:
          GOWORK: "off"
        run: go run . preflight --repo ../..

      - name: Validate generated release changelog
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'automation/release-changelog'
        working-directory: scripts/releasegate
        env:
          GOWORK: "off"
        run: go run . changelog --repo ../.. --check

  gofmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt -s check
        run: |
          # The last entry is the release tooling's own module: `scripts/` is where the
          # repository's own commands live, and it is a Go module like any other.
          diff=$(gofmt -s -l core sandbox inference agent tool examples/forge scripts)
          if [ -n "$diff" ]; then
            echo "Files not formatted:"
            echo "$diff"
            exit 1
          fi

  check-consumers:
    name: Consumers build outside the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Every example is read the way a reader reads it: its own go.mod
      # and go.sum, no workspace. The target also
      # checks that an exemption in CONSUMER_EXEMPT is still needed — a
      # module that starts building here turns this lane red instead of
      # leaving a stale exemption behind. See the Makefile.
      - name: Check consumers
        run: make check-consumers
      # The skill's validator is the other consumer: its own module, pinned to
      # a released core, and the only thing that runs the shipped templates. It
      # also fails when its pin falls behind the newest core tag, which is how
      # the previous validator silently kept checking a schema nobody wrote.
      - name: Check the deployment skill
        run: make check-skill

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Per-package floors, not a total: a total moves by two points when a
      # well-tested file is split, and it hides the package that lost its tests
      # behind the package that gained some. `make cover-write` is the only way
      # to raise a floor, and the floors live in core/coverage-floor.txt where a
      # reviewer sees a lowered number in the diff.
      - run: make cover-check

  lint:
    name: Lint (${{ matrix.module }})
    needs: [compute-matrix]
    if: needs.compute-matrix.outputs.lint_enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.lint) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --new-from-rev=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # The config in .github/actionlint.yaml makes the workflow files
      # self-checking: a wrong expression or a missing needs entry fails here.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # Working-tree scan: a pull request checkout has no history to scan, and
      # a secret committed in this PR is still in the tree.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --no-git --redact --verbose
      # The config lives at the repository root: the CLI only accepts its own
      # file names, so a path under .github/ is rejected before anything is
      # linted (which is what this lane did: fail, never run).
      #
      # The globs are here rather than in the config because the action passes
      # them on the command line, where they win. `CHANGELOG.md` is generated
      # from changeset summaries whose prose is not written as Markdown (a
      # summary naming `backends/*` reads as emphasis), so this lane lints what
      # is authored and the generator owns its own output.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            docs/**/*.md
      # Linting and formatting are different gates: markdownlint reads structure
      # (a table with the wrong column count, a heading without a blank line),
      # prettier reads layout (cell padding, fence indentation, list markers).
      #
      # The file list comes from git, not from globs. A glob over `docs/**` also
      # catches the working documents a checkout keeps there and never commits,
      # so they would need excluding by hand; and a hand-written glob is a list
      # that silently goes stale the day a page is added outside it.
      # `SECURITY.md` and the example READMEs were exactly that: unformatted,
      # unchecked, invisible to the gate. Every tracked Markdown file is checked
      # now, and a new one is covered the moment it is tracked. The version is
      # pinned because a minor prettier release re-wraps prose and would
      # otherwise redden main on its own schedule.
      - name: prettier
        run: |
          git ls-files -z '*.md' | xargs -0 npx --yes prettier@3.6.2 --check
      # A module that needs a tidy is a module whose go.mod no longer describes
      # its imports; the release gate rejects that state, so catch it earlier.
      - name: go mod tidy
        run: |
          set -e
          for d in core examples/forge; do
            echo "==> $d"
            ( cd "$d" && go mod tidy -diff )
          done

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # A fixed budget per target: enough to catch a panic on an edge input, not a
      # real hunt (FUZZTIME extends it locally). The seed corpus lives next to each
      # target and `make test` replays it, so what this job adds is the search, not
      # the regressions.
      #
      # The build cache is where the engine keeps the inputs that expanded coverage
      # without failing. It is per-machine, so without a cache every run starts from
      # the committed seeds and the search never accumulates.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: fuzz-${{ hashFiles('**/testdata/fuzz/**') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ hashFiles('**/testdata/fuzz/**') }}-
      - run: FUZZTIME=60s scripts/fuzz.sh

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # One iteration per benchmark: enough to prove every benchmark compiles,
      # runs and reports, which is exactly what a signature change or a moved
      # fixture breaks silently. Numbers are not compared here — timings on a
      # shared runner vary enough that a threshold would be noise; the
      # allocation guards in the unit tests are the deterministic gate.
      - run: make bench-check

  test-shuffle:
    name: Shuffle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Order-dependent tests are invisible under the default order; three
      # shuffled runs are cheap and catch shared state in the table and the
      # stores. The make target is what runs, not a hand-written loop over
      # `core`: the modules it covers are the workspace's, and a lane that
      # names one module stops covering the others the day a module is added.
      - run: make test-shuffle

  test:
    name: Test (${{ matrix.module }})
    needs: compute-matrix
    if: needs.compute-matrix.outputs.test_enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@v4
      # The floor is 1.26 and the patch is pinned, not floated: govulncheck
      # below reports the standard library of the toolchain it runs on. The
      # 2026-10-08 batch is fixed in 1.26.9 (and 1.27.2) with no 1.25 release;
      # GO-2026-6809 (a crypto/x509 intermediate denylist) in 1.26.10 (and
      # 1.27.3); GO-2026-6859 (a net/http MaxBytesReader race) in 1.26.11 (and
      # 1.27.4). Both the runner image and the setup-go manifest lag fresh
      # releases, so the pin, not the image, is what decides which stdlib the
      # scan reads. The other lanes keep the floating minor: no verdict of
      # theirs depends on the patch. Bump this pin when a security release
      # lands; the scan reddening on the previous patch is the reminder.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: ${{ matrix.module }}
        env:
          # From the matrix: a consumer pins released versions and is compiled
          # outside this workspace, the way a reader compiles it. Inside it,
          # every core change would redden a module that never sees it.
          GOWORK: ${{ matrix.gowork }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: ${{ matrix.module }}
        env:
          # The scan loads the module's packages, so it has to resolve them the
          # way the tests did: a consumer outside this workspace, everything
          # else inside it.
          GOWORK: ${{ matrix.gowork }}

  # The bwrap integration lane tested ./sandbox-bwrap, which moved to the `sandbox`
  # module with the backend. It returns there, together with the backend it gates.

  test-core-windows:
    name: Test core (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build
        working-directory: core
        run: go build ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test -count=1 ./...
      # sandbox/sessionkit left core with the sandbox module, and its windows race
      # step goes with it: the sampler and the cap goroutine it guards are the code
      # where a race is silent rather than loud, so that lane is not dropped there.

  # The windows integration lane tested ./sandbox-windows, which moved to the
  # `sandbox` module with the backend; test-core-windows still covers core itself.

  test-sandbox-macos:
    name: Integration core/sandbox (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # The kqueue source, the cross-backend journal contract suite and
      # the seatbelt backend only run where the platform primitives
      # exist; the cross-vet lanes prove they compile, this proves they
      # work — under the race detector, because this is the only lane
      # that executes the kqueue source and its leaf watches. sandbox-exec
      # ships with macOS, so nothing is installed.
      #
      # The backends and sessionkit this lane used to exercise moved to the
      # `sandbox` module; the core contract keeps its darwin path here.
      - name: Test
        working-directory: core
        run: go test -count=1 -race -timeout 300s ./sandbox/...

  ci-pass:
    name: CI
    if: always()
    needs:
      - release-intent
      - gofmt
      - coverage
      - check-consumers
      - compute-matrix
      - lint
      - hygiene
      - fuzz
      - test-shuffle
      - bench
      - test
      - test-core-windows
      - test-sandbox-macos
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=( \
            "${{ needs.release-intent.result }}" \
            "${{ needs.gofmt.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.check-consumers.result }}" \
            "${{ needs.compute-matrix.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.hygiene.result }}" \
            "${{ needs.fuzz.result }}" \
            "${{ needs.test-shuffle.result }}" \
            "${{ needs.bench.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-core-windows.result }}" \
            "${{ needs.test-sandbox-macos.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
