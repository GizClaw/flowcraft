name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used for generated release PR validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      memory: ${{ steps.filter.outputs.memory }}
      sdkx: ${{ steps.filter.outputs.sdkx }}
      voice: ${{ steps.filter.outputs.voice }}
      claw: ${{ steps.filter.outputs.claw }}
      retrieval_e2e: ${{ steps.filter.outputs.retrieval_e2e }}
      eval: ${{ steps.filter.outputs.eval }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || '' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          filters: |
            sdk:
              - 'sdk/**'
            memory:
              - 'memory/**'
            sdkx:
              - 'sdkx/**'
            voice:
              - 'voice/**'
            claw:
              - 'cmd/claw/**'
            retrieval_e2e:
              - 'tests/e2e/retrieval/**'
            eval:
              - 'eval/**'
            ci:
              - '.github/workflows/**'
              - '.release/**'
              - 'Makefile'
              - 'tools/releasegate/**'

  release-intent:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Test release gate tooling
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go test -count=1 -race ./...

      - name: Validate immutable changesets
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
        run: go run . validate --repo ../.. --base "$BASE_SHA"

      - name: Validate pending release plan
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . plan --repo ../..

      - name: Validate generated release changelog
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'automation/release-changelog'
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . changelog --repo ../.. --check

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.voice == 'true' || needs.detect.outputs.claw == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: go vet
        run: |
          # Workspace members (go.work) — vetted with the workspace
          # overlay so cross-module symbols at monorepo HEAD resolve.
          for m in sdk memory sdkx voice cmd/claw eval; do
            echo "==> vet $m"
            (cd "$m" && go vet ./...)
          done
          # The e2e suite pins released dependencies and is build-tagged,
          # so vet it outside the workspace with the e2e tag.
          for m in tests/e2e/retrieval; do
            echo "==> vet $m (e2e tag, GOWORK=off)"
            (cd "$m" && GOWORK=off go vet -tags=e2e ./...)
          done
      - name: gofmt check
        run: |
          diff=$(gofmt -l sdk memory sdkx voice cmd/claw eval tests/e2e/retrieval)
          if [ -n "$diff" ]; then
            echo "Files not formatted:"
            echo "$diff"
            exit 1
          fi

  test-sdk:
    name: Test sdk (Go ${{ matrix.go-version }})
    needs: detect
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: sdk

  test-memory:
    name: Test memory (Go ${{ matrix.go-version }})
    needs: detect
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: memory

  test-sdkx:
    name: Test sdkx (Go ${{ matrix.go-version }})
    needs: detect
    # sdkx depends on sdk and memory adapters, so run when any changes
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: sdkx

  test-sdkx-nsjail-integration:
    name: Integration sdkx/sandbox/nsjail
    needs: detect
    # nsjail backend lives in sdkx and depends on sdk/sandbox; rerun
    # whenever either module's source changes (or CI itself changes).
    # The job installs the nsjail binary and runs the
    # integration_nsjail-tagged tests, which never run in the default
    # test-sdkx lane (the build tag keeps them out).
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install nsjail
        # Ubuntu 24.04 (noble) dropped the nsjail package from
        # universe, so we build from source. The compile takes ~30s
        # on a GitHub-hosted runner — cheap enough to do every run
        # given how rarely this job triggers (sdk/sdkx changes only).
        run: |
          set -euo pipefail
          if command -v nsjail >/dev/null 2>&1; then
            echo "nsjail already present: $(command -v nsjail)"
            nsjail --help 2>&1 | head -3 || true
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libcap-dev libprotobuf-dev protobuf-compiler \
            libnl-3-dev libnl-route-3-dev \
            bison flex
          git clone --depth 1 https://github.com/google/nsjail.git /tmp/nsjail
          make -C /tmp/nsjail -j"$(nproc)"
          sudo install -m 0755 /tmp/nsjail/nsjail /usr/local/bin/nsjail
          nsjail --help 2>&1 | head -3 || true
          which nsjail
      - name: Test
        run: go test -tags=integration_nsjail -count=1 -timeout 180s ./sandbox/nsjail/...
        working-directory: sdkx

  test-voice:
    name: Test voice (Go ${{ matrix.go-version }})
    needs: detect
    # voice depends on sdk, so run when either changes
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.voice == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: voice

  test-claw:
    name: Test claw (Go ${{ matrix.go-version }})
    needs: detect
    # claw composes sdk, memory, and sdkx; rerun when any dependency changes.
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.claw == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: cmd/claw

  test-retrieval-e2e:
    name: E2E retrieval (Go ${{ matrix.go-version }})
    needs: detect
    # On-disk LocalWorkspace conformance suite for sdkx/retrieval/workspace.
    # Reruns when sdk/memory/sdkx changes or the suite itself moves.
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.retrieval_e2e == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    env:
      # Pinned to released sdk/sdkx tags via go.mod; keep go.work
      # out of the resolution path so the pin is honoured.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -tags=e2e -count=1 -race -timeout 120s ./...
        working-directory: tests/e2e/retrieval

  test-eval:
    name: Test eval (Go ${{ matrix.go-version }})
    needs: detect
    # eval is a workspace member (see go.work) — sdk/sdkx resolve to
    # monorepo HEAD via the workspace overlay, so rerun whenever sdk,
    # memory, sdkx, or eval source changes.
    if: needs.detect.outputs.sdk == 'true' || needs.detect.outputs.memory == 'true' || needs.detect.outputs.sdkx == 'true' || needs.detect.outputs.eval == 'true' || needs.detect.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -race ./...
        working-directory: eval

  # Gate job: single required status check for branch protection.
  # Always runs; succeeds only when all triggered jobs pass.
  ci-pass:
    name: CI
    if: always()
    needs: [detect, release-intent, lint, test-sdk, test-memory, test-sdkx, test-sdkx-nsjail-integration, test-voice, test-claw, test-retrieval-e2e, test-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.detect.result }}" != "success" ]]; then
            echo "Change detection failed: ${{ needs.detect.result }}"
            exit 1
          fi
          results=( \
            "${{ needs.release-intent.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.test-sdk.result }}" \
            "${{ needs.test-memory.result }}" \
            "${{ needs.test-sdkx.result }}" \
            "${{ needs.test-sdkx-nsjail-integration.result }}" \
            "${{ needs.test-voice.result }}" \
            "${{ needs.test-claw.result }}" \
            "${{ needs.test-retrieval-e2e.result }}" \
            "${{ needs.test-eval.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
