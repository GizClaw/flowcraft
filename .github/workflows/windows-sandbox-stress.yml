name: Windows sandbox stress

# Nightly stress lane for the Windows session layer.
#
# What it covers: sandbox/sessionkit's Windows-only paths — the job object and
# its kill-on-close tree, the ConPTY session and its exit codes, the environment
# block, and the cap sampler that stops with the session. These are the pieces
# that hand a process tree to a job object and read a pseudo-console back, which
# is where a single pass misses an ordering bug.
#
# What it used to cover: an AppContainer/WFP isolation backend that lived at
# core/sandbox-windows. That package is not in this tree — the lane kept naming it,
# so every nightly run has failed with "matched no packages" since the module
# split, silently, because nothing gates on this lane. The package list is
# `make sandbox-faults FAULT_PACKAGES=./sessionkit/...` now, so a move is one edit.
#
# GODEBUG makes the garbage collector clobber freed objects and check
# pointer validity, which turns latent mis-sized or dangling writes into
# loud failures. The lane is diagnostic: it is not a required check.

on:
  workflow_dispatch:
  schedule:
    # 18:10 UTC — 02:10 Asia/Shanghai.
    - cron: "10 18 * * *"

permissions:
  contents: read

jobs:
  stress:
    name: Stress sandbox/sessionkit (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Race + repeat
        env:
          GODEBUG: invalidptr=1,clobberfree=1
        run: make sandbox-faults FAULT_PACKAGES=./sessionkit/... FAULT_COUNT=3
