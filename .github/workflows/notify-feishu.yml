name: notify / feishu

# Completion notifier for the memory eval workflows. Runs on a GitHub-hosted
# runner so it stays alive even when the flowcraft-eval self-hosted runner
# dies mid-run. Posts one text message per finished eval to the configured
# Feishu custom-bot webhook.
on:
  workflow_run:
    workflows:
      - "eval / locomo"
      - "eval / longmemeval"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve eval shortname
        id: meta
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          short="${WF_NAME##*/ }"
          short="$(echo "$short" | tr -d '[:space:]')"
          echo "shortname=$short" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${short}-report-${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"

      - name: Download report artifact
        id: dl
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ./report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Compose + post Feishu message
        env:
          STATUS:     ${{ github.event.workflow_run.conclusion }}
          WF_NAME:    ${{ github.event.workflow_run.name }}
          SHORT:      ${{ steps.meta.outputs.shortname }}
          RUN_URL:    ${{ github.event.workflow_run.html_url }}
          RUN_ID:     ${{ github.event.workflow_run.id }}
          BRANCH:     ${{ github.event.workflow_run.head_branch }}
          EVENT:      ${{ github.event.workflow_run.event }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          set +e
          if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
            echo "FEISHU_WEBHOOK_URL not set; skipping notify"
            exit 0
          fi

          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"

          REPORT=$(find ./report -type f -name '*.json' 2>/dev/null | head -n1)
          METRICS="report not produced"
          if [ -n "$REPORT" ] && [ -s "$REPORT" ]; then
            METRICS=$(jq -r '
              def ms(x): if x == null then "n/a" else ((x/1)|tostring) + "ms" end;
              def errs: [.per_question[]? | select(.error != null)] | length;
              "suite=" + ((.suite // "n/a")|tostring)
              + " profile=" + ((.profile // "n/a")|tostring)
              + " dataset=" + ((.dataset // "n/a")|tostring)
              + " host=" + ((.host // "n/a")|tostring)
              + "\n"
              + "n=" + (.n|tostring)
              + " errors=" + (errs|tostring)
              + " qa.judge=" + (.aggregate."qa.judge"|tostring)
              + " qa.f1=" + (.aggregate."qa.f1"|tostring)
              + " qa.em=" + (.aggregate."qa.em"|tostring)
              + (if .aggregate."recall.k_hit" != null
                   then " recall.k_hit=" + (.aggregate."recall.k_hit"|tostring)
                   else "" end)
              + (if .aggregate."qa.abstain" != null
                   then " qa.abstain=" + (.aggregate."qa.abstain"|tostring)
                   else "" end)
              + "\n"
              + "answer_ms=" + ms(.latency.answer.total_ms)
              + " judge_ms=" + ms(.latency.judge.total_ms)
              + " recall_ms=" + ms(.latency.recall.total_ms)
            ' "$REPORT" 2>/dev/null) || METRICS="metrics parse failed"
            [ -z "$METRICS" ] && METRICS="(metrics empty)"
          fi

          BODY=$(printf '%s\n%s\n%s\nrun: %s' \
            "$ICON $WF_NAME finished" \
            "status=$STATUS  branch=$BRANCH  event=$EVENT" \
            "$METRICS" \
            "$RUN_URL")

          PAYLOAD=$(printf '%s' "$BODY" | jq -Rs '{msg_type:"text", content:{text:.}}')
          curl -sS -X POST "$FEISHU_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
