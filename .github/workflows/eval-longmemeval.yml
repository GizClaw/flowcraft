name: eval / longmemeval

# LongMemEval (ICLR 2025) against the flowcraft memory implementation.
# The upstream cleaned datasets live on HuggingFace and are converted to
# the eval JSONL on the runner host from a fixed ref.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Converted dataset path (host) or fixed-ref refresh"
        required: true
        default: "/var/lib/flowcraft-eval/datasets/longmemeval_oracle.jsonl"
      lme_ref:
        description: "HuggingFace revision of xiaowu0162/longmemeval-cleaned"
        required: false
        default: "main"
      inference:
        description: "inference.yaml path (repo default uses env keys)"
        required: false
        default: "memory/eval/inference.yaml"
      generate_model:
        description: "Fact extraction model"
        required: false
        default: "deepseek:deepseek-v4-flash:default"
      embed_model:
        description: "Embedding model"
        required: false
        default: "bytedance:doubao-embedding-vision:default"
      answer_model:
        description: "QA answer model"
        required: false
        default: "bytedance:doubao-seed-2-0-lite:default"
      judge_model:
        description: "LLM judge model (empty disables judge)"
        required: false
        default: "bytedance:doubao-seed-2-0-lite:default"
      max_items:
        description: "ContextRequest max items"
        required: false
        default: "20"
      max_tokens:
        description: "ContextRequest max tokens"
        required: false
        default: "4096"
      limit:
        description: "Cap questions to the first N (0 = all)"
        required: false
        default: "0"
      limit_conversations:
        description: "Cap conversations to the first N (0 = all)"
        required: false
        default: "0"
      concurrency:
        description: "QA worker count"
        required: false
        default: "4"
      ingest_timeout:
        description: "Per-conversation ingest deadline"
        required: false
        default: "10m"
      qa_timeout:
        description: "Per-question recall+answer+judge deadline"
        required: false
        default: "10m"
      commit_granularity:
        description: "session, exchange, or turn"
        required: false
        default: "session"

concurrency:
  group: eval-longmemeval
  cancel-in-progress: false

env:
  REPORT_DIR: /var/lib/flowcraft-eval/reports

jobs:
  run:
    runs-on: [self-hosted, flowcraft-eval]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Build eval binary
        run: |
          cd memory/eval
          go build -trimpath -o /tmp/memory-eval .

      - name: Refresh dataset from fixed ref
        env:
          DATASET_IN: ${{ inputs.dataset }}
          LME_REF: ${{ inputs.lme_ref }}
        run: |
          set -eu
          case "$DATASET_IN" in
            /var/lib/flowcraft-eval/datasets/longmemeval_oracle.jsonl)
              UPSTREAM=longmemeval_oracle.json ;;
            /var/lib/flowcraft-eval/datasets/longmemeval_s.jsonl|/var/lib/flowcraft-eval/datasets/longmemeval_s_cleaned.jsonl)
              UPSTREAM=longmemeval_s_cleaned.json ;;
            /var/lib/flowcraft-eval/datasets/longmemeval_m.jsonl|/var/lib/flowcraft-eval/datasets/longmemeval_m_cleaned.jsonl)
              UPSTREAM=longmemeval_m_cleaned.json ;;
            *)
              echo "skipping refresh: custom dataset path"
              exit 0 ;;
          esac
          mkdir -p "$(dirname "$DATASET_IN")" /var/lib/flowcraft-eval/datasets/cache
          CACHE="/var/lib/flowcraft-eval/datasets/cache/${UPSTREAM%.json}-${LME_REF}.json"
          if [ ! -s "$CACHE" ]; then
            curl -sSLf --max-time 600 -o "$CACHE.partial" \
              "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/${LME_REF}/${UPSTREAM}"
            mv "$CACHE.partial" "$CACHE"
          fi
          /tmp/memory-eval convert --suite longmemeval --in "$CACHE" --out "$DATASET_IN"

      - name: Run
        env:
          REPORT_OUT: ${{ env.REPORT_DIR }}/${{ github.run_id }}.json
        run: |
          set -eu
          mkdir -p "$REPORT_DIR"
          test -f /etc/flowcraft-eval/.env
          set -a
          source /etc/flowcraft-eval/.env
          set +a
          /tmp/memory-eval run \
            --dataset "${{ inputs.dataset }}" \
            --inference "${{ inputs.inference }}" \
            --suite longmemeval \
            --generate-model "${{ inputs.generate_model }}" \
            --embed-model "${{ inputs.embed_model }}" \
            --answer-model "${{ inputs.answer_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --max-items "${{ inputs.max_items }}" \
            --max-tokens "${{ inputs.max_tokens }}" \
            --limit "${{ inputs.limit }}" \
            --limit-conversations "${{ inputs.limit_conversations }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --ingest-timeout "${{ inputs.ingest_timeout }}" \
            --qa-timeout "${{ inputs.qa_timeout }}" \
            --commit-granularity "${{ inputs.commit_granularity }}" \
            --notify-name "longmemeval-${{ github.run_id }}" \
            --notify-progress-pct 10 \
            --out "$REPORT_OUT"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-report-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 90
