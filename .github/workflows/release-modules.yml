name: Release modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-modules
  cancel-in-progress: false

jobs:
  plan:
    name: Plan pending releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      has_core: ${{ steps.plan.outputs.has_core }}
      changelog_ready: ${{ steps.changelog.outputs.ready }}
      modules: ${{ steps.plan.outputs.modules }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Validate release changesets
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: go run . validate --repo ../..

      - name: Build release plan
        id: plan
        working-directory: tools/releasegate
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go run . plan --repo ../.. --json > /tmp/release-plan.json
          cat /tmp/release-plan.json
          modules=$(jq -c '.modules' /tmp/release-plan.json)
          tags=$(jq -c '.tags' /tmp/release-plan.json)
          count=$(jq '.modules | length' /tmp/release-plan.json)
          if jq -e '.[] | select(.module == "core")' \
            <<< "$modules" >/dev/null; then
            has_core=true
          else
            has_core=false
          fi
          {
            echo "modules=$modules"
            echo "tags=$tags"
            echo "has_core=$has_core"
            if [ "$count" -gt 0 ]; then
              echo "has_releases=true"
            else
              echo "has_releases=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release changelog PR
        id: changelog
        if: steps.plan.outputs.has_releases == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: automation/release-changelog
          TAGS_JSON: ${{ steps.plan.outputs.tags }}
        run: |
          set -euo pipefail
          make release-changelog
          if git diff --quiet -- CHANGELOG.md; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          git add CHANGELOG.md
          git commit -m "chore(release): update module changelog"

          remote_tip=$(git ls-remote --heads origin \
            "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
          if [ -n "$remote_tip" ]; then
            git fetch origin \
              "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            author_email=$(git show -s --format=%ae "$remote_tip")
            subject=$(git show -s --format=%s "$remote_tip")
            if [ "$author_email" != "41898282+github-actions[bot]@users.noreply.github.com" ] ||
              [ "$subject" != "chore(release): update module changelog" ]; then
              echo "$RELEASE_BRANCH contains a non-automation commit; refusing to overwrite it" >&2
              exit 1
            fi
          fi
          git push \
            "--force-with-lease=refs/heads/$RELEASE_BRANCH:$remote_tip" \
            origin \
            "HEAD:refs/heads/$RELEASE_BRANCH"

          pr_url=$(gh pr list \
            --head "$RELEASE_BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            body_file=$(mktemp)
            {
              echo "Aggregates all pending immutable changesets into \`CHANGELOG.md\`."
              echo
              echo "Planned tags:"
              jq -r '.[] | "- `" + . + "`"' <<< "$TAGS_JSON"
              echo
              echo "Merging this PR reruns the core release gate and publishes the planned core tag."
            } > "$body_file"
            pr_url=$(gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): update module changelog" \
              --body-file "$body_file")
          fi

          gh workflow run ci.yml \
            --ref "$RELEASE_BRANCH" \
            --field "base_sha=$GITHUB_SHA"
          echo "release changelog PR: $pr_url"
          echo "ready=false" >> "$GITHUB_OUTPUT"

  release-core:
    name: Release core
    needs: plan
    if: needs.plan.outputs.has_core == 'true' && needs.plan.outputs.changelog_ready == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASES_JSON: ${{ needs.plan.outputs.modules }}
      EXPECTED_TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revalidate release plan
        run: |
          set -euo pipefail
          (
            cd tools/releasegate
            GOWORK=off go run . changelog --repo ../.. --check
            GOWORK=off go run . plan --repo ../.. --json
          ) > /tmp/release-plan.json
          actual_tags=$(jq -c '.tags' /tmp/release-plan.json)
          if [ "$actual_tags" != "$EXPECTED_TAGS" ]; then
            echo "release plan changed: expected $EXPECTED_TAGS, got $actual_tags" >&2
            exit 1
          fi

      - name: Gate and publish core
        run: |
          set -euo pipefail

          module="core"
          dir="core"
          modfile="$RUNNER_TEMP/${module}.mod"
          sumfile="$RUNNER_TEMP/${module}.sum"

          cp "$dir/go.mod" "$modfile"
          cp "$dir/go.sum" "$sumfile"

          (
            cd "$dir"
            GOWORK=off GOFLAGS="-modfile=$modfile" go mod tidy
            GOWORK=off GOFLAGS="-modfile=$modfile" go build ./...
            GOWORK=off GOFLAGS="-modfile=$modfile" go vet ./...
            GOWORK=off GOFLAGS="-modfile=$modfile" go test -count=1 -race ./...
          )

          tag=$(jq -r '.[] | select(.module == "core") | .tag' <<< "$RELEASES_JSON")
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag:refs/tags/$tag"
