name: Windows sandbox

# The Windows sandbox implementation is developed on its own branch and
# verified here, on a real Windows host, before it is merged. The main CI
# workflow only runs on pull requests to `main`, and this branch targets
# `rewrite/rust-platform`, so without this lane every line of Win32 code in
# `flowcraft-win32` and every `cfg(windows)` branch in `caps::sandbox` would
# be merged unbuilt.
#
# The lane is meant to *grow*: each phase (W1 job objects, W2 ConPTY, W3
# integrity levels, W4 app containers) adds the fixtures it makes runnable and
# removes the line that says why they were skipped.

on:
  push:
    branches:
      - feat/win-sandbox
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows sandbox
    runs-on: windows-latest
    # A terminal test that blocks on a read takes the whole lane with it; the
    # default is six hours, which is six hours of no feedback.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust/rust-toolchain.toml | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

      # Everything must type-check, tests included: a `cfg(windows)` branch that
      # is never compiled is not an implementation.
      - name: Type-check the Windows shape
        working-directory: rust
        run: >
          cargo check -p flowcraft -p flowcraft-win32
          --all-targets --features sandbox,wire

      - name: Clippy
        working-directory: rust
        shell: bash
        run: |
          cargo clippy -p flowcraft -p flowcraft-win32 --all-targets \
            --features sandbox,wire -- -D warnings

      # A control experiment, before the implementation it guards: if the
      # reference ConPTY backend cannot reach a pseudo console here, a failure in
      # our own backend says nothing about our code.
      - name: ConPTY control (reference backend)
        working-directory: rust
        run: >
          cargo test -p flowcraft --features sandbox,wire
          --test sandbox_win_conpty_control

      # The Win32 mechanisms on their own: job creation, limits, accounting, and
      # what the kernel reports when a cap ends a tree.
      - name: Job objects
        working-directory: rust
        run: cargo test -p flowcraft-win32

      # The session semantics only a job object can provide: a terminate that
      # reaches descendants, and a cap reported as a budget.
      - name: Sandbox sessions on Windows
        working-directory: rust
        run: >
          cargo test -p flowcraft --features sandbox,wire
          --test sandbox_windows

      # The platform-agnostic half of the sandbox suite, shared with the linux
      # lane. The exclusions are named in `ci.yml` and may only shrink.
      - name: Platform-independent sandbox semantics
        working-directory: rust
        shell: bash
        run: |
          cargo test -p flowcraft --lib --features sandbox,wire -- \
            caps::sandbox::wire \
            caps::sandbox::contract \
            caps::sandbox::scope \
            caps::sandbox::codes \
            caps::sandbox::session::log \
            caps::sandbox::session::registry \
            caps::sandbox::session::terminal \
            caps::sandbox::policy::allowlist \
            caps::sandbox::policy::readonly \
            caps::sandbox::journal::ring \
            caps::sandbox::journal::fold \
            caps::sandbox::journal::source \
            caps::sandbox::net::pattern \
            caps::sandbox::net::matcher \
            caps::sandbox::limits::tests \
            caps::sandbox::confinement::bwrap \
            caps::sandbox::confinement::seatbelt \
            caps::sandbox::confinement::path \
            caps::sandbox::confinement::tests
