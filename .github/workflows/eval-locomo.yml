name: eval / locomo

# LoCoMo-10 dialog-memory benchmark against the flowcraft memory
# implementation. Runs the memory/eval CLI on the self-hosted
# flowcraft-eval runner; datasets are regenerated from a fixed upstream
# ref into an external JSONL on the runner host.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Converted dataset path (host) or fixed-ref refresh"
        required: true
        default: "/var/lib/flowcraft-eval/datasets/locomo10.jsonl"
      locomo_ref:
        description: "Upstream snap-research/locomo git ref"
        required: false
        default: "main"
      inference:
        description: "inference.yaml path (repo default uses env keys)"
        required: false
        default: "memory/eval/inference.yaml"
      generate_model:
        description: "Fact extraction model"
        required: false
        default: "deepseek:deepseek-v4-flash:default"
      embed_model:
        description: "Embedding model"
        required: false
        default: "bytedance:doubao-embedding-vision:default"
      answer_model:
        description: "QA answer model"
        required: false
        default: "bytedance:doubao-seed-2-0-lite:default"
      judge_model:
        description: "LLM judge model (empty disables judge)"
        required: false
        default: "bytedance:doubao-seed-2-0-lite:default"
      max_items:
        description: "ContextRequest max items"
        required: false
        default: "20"
      max_tokens:
        description: "ContextRequest max tokens"
        required: false
        default: "4096"
      limit:
        description: "Cap questions to the first N (0 = all)"
        required: false
        default: "0"
      limit_conversations:
        description: "Cap conversations to the first N (0 = all)"
        required: false
        default: "0"
      concurrency:
        description: "QA worker count"
        required: false
        default: "4"
      ingest_timeout:
        description: "Per-conversation ingest deadline"
        required: false
        default: "10m"
      qa_timeout:
        description: "Per-question recall+answer+judge deadline"
        required: false
        default: "10m"

concurrency:
  group: eval-locomo
  cancel-in-progress: false

env:
  REPORT_DIR: /var/lib/flowcraft-eval/reports

jobs:
  run:
    runs-on: [self-hosted, flowcraft-eval]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Build eval binary
        run: |
          cd memory
          go build -trimpath -o /tmp/memory-eval ./eval

      - name: Refresh dataset from fixed ref
        env:
          DATASET_IN: ${{ inputs.dataset }}
          LOCOMO_REF: ${{ inputs.locomo_ref }}
        run: |
          set -eu
          DEFAULT=/var/lib/flowcraft-eval/datasets/locomo10.jsonl
          if [ "$DATASET_IN" != "$DEFAULT" ]; then
            echo "skipping refresh: custom dataset path"
            exit 0
          fi
          mkdir -p /var/lib/flowcraft-eval/datasets /var/lib/flowcraft-eval/datasets/cache
          CACHE="/var/lib/flowcraft-eval/datasets/cache/locomo10-${LOCOMO_REF}.json"
          if [ ! -s "$CACHE" ]; then
            curl -sSLf --max-time 600 -o "$CACHE.partial" \
              "https://cdn.jsdelivr.net/gh/snap-research/locomo@${LOCOMO_REF}/data/locomo10.json" \
              || curl -sSLf --max-time 600 -o "$CACHE.partial" \
                "https://raw.githubusercontent.com/snap-research/locomo/${LOCOMO_REF}/data/locomo10.json"
            mv "$CACHE.partial" "$CACHE"
          fi
          /tmp/memory-eval convert --suite locomo --in "$CACHE" --out "$DEFAULT"

      - name: Run
        env:
          REPORT_OUT: ${{ env.REPORT_DIR }}/${{ github.run_id }}.json
        run: |
          set -eu
          mkdir -p "$REPORT_DIR"
          test -f /etc/flowcraft-eval/.env
          set -a
          source /etc/flowcraft-eval/.env
          set +a
          /tmp/memory-eval run \
            --dataset "${{ inputs.dataset }}" \
            --inference "${{ inputs.inference }}" \
            --suite locomo \
            --generate-model "${{ inputs.generate_model }}" \
            --embed-model "${{ inputs.embed_model }}" \
            --answer-model "${{ inputs.answer_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --max-items "${{ inputs.max_items }}" \
            --max-tokens "${{ inputs.max_tokens }}" \
            --limit "${{ inputs.limit }}" \
            --limit-conversations "${{ inputs.limit_conversations }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --ingest-timeout "${{ inputs.ingest_timeout }}" \
            --qa-timeout "${{ inputs.qa_timeout }}" \
            --out "$REPORT_OUT"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomo-report-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 90
