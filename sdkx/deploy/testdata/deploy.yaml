# Fixture for the deploy loader tests. Every kind / impl / hook type
# here is a fake registered in deploy_test.go, not something this
# package ships: the only builtin is the after kind
# "discard_on_interrupt". The shape is what is under test, not the names.
version: v1
resources:
  # A container resource: items are addressed as "fs/<name>".
  fs:
    kind: workspace.Registry
    impl: fake
    settings:
      names: [project, scratch]
  # Depends on fs, and is declared BEFORE it alphabetically would not
  # matter — construction order is topological, not lexical.
  box:
    kind: sandbox.Registry
    impl: fake
    deps:
      workspaces: fs
    settings:
      names: [coding]
  # A whole-bound, non-container resource.
  js_main:
    kind: script.runtime
    impl: fakejs
    settings:
      pool_size: 8
  # Bound only by hooks, never by an agent dep — which is what makes
  # the "nothing binds this resource" check count hook deps too.
  store:
    kind: fake.Store
    impl: fake
    deps:
      workspace: fs/project
agents:
  researcher:
    card:
      name: 研究员
      description: 深度调研
    tools: [search, fetch]
    engine:
      kind: graph
      settings:
        graph: graphs/research.json
        max_steps: 8
    deps:
      workspace: fs/project
      runner: box/coding
      script_runtime: js_main
      tools: {source: host.tools, ref: default}
    before:
      type: fake_before
      deps:
        store: store
      settings:
        window: 20
    hooks:
      - type: fake_hook
        deps:
          store: store
        settings:
          store: main
    after:
      - type: discard_on_interrupt
        settings:
          reason: barge-in
          causes: [user_input, user_cancel]
    policy:
      max_revise: 2
      artifact_channels: [drafts]
  minimal:
    engine:
      kind: inline
