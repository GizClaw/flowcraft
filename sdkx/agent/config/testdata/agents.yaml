version: v1
agents:
  researcher:
    card:
      name: 研究员
      description: 深度调研
    tools: [search, fetch]
    engine:
      kind: graph
      settings:
        graph: graphs/research.yaml
        max_steps: 8
    deps:
      llm:
        source: inference.profile
        ref: kimi-k2
      tools:
        source: tool.catalog
        ref: default
    before:
      type: history
      settings:
        window: 20
    hooks:
      - type: transcript
        settings:
          store: history
    after:
      - type: discard_on_interrupt
        settings:
          reason: barge-in
          causes: [user_input, user_cancel]
    policy:
      max_revise: 2
      artifact_channels: [drafts]
  minimal:
    engine:
      kind: inline
