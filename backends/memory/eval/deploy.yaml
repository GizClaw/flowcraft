version: v1

# Eval deployment document: workspace + inference + memory assembly.
#
# One credential (GATEWAY_API_KEY) reaches every model this document declares,
# over two drivers: ai.haivivi.cn speaks the OpenAI wire for generation and
# decisions, and the Ark wire for the multimodal embedding the vector lane
# needs. A provider is a wire plus an endpoint plus a credential, which is why
# there are two of them for one host.
resources:
  ws:
    kind: workspace.Workspace
    impl: local
    settings:
      root: ./workspace

  secrets:
    kind: secret.Store
    impl: env
    settings:
      id: env
      default: true

  gateway:
    kind: inference.Provider
    impl: openai
    settings:
      id: gateway
      spec:
        # The chat surface rejects json_schema response formats at runtime
        # (the fact extractor asks for one), so drive the responses surface.
        api: responses
        endpoint:
          base_url: https://ai.haivivi.cn/v1
        wire:
          reasoning_channel: text
        models:
          # The default generate model. Every report this directory stores was
          # measured with it, so it stays the default and the fingerprint value
          # `answer_model` keeps meaning what it meant.
          - name: deepseek-flash
            kind: generate
            capabilities:
              inputs: [text, image]
              outputs: [text]
          # The alternative generate model, selected per run with
          # `-answer-provider gateway -answer-model deepseek-v4-pro`. Declared
          # here so the answer A/B and the catalog probe both see it; it is a
          # text-only model, so an image run cannot select it.
          - name: deepseek-v4-pro
            kind: generate
            capabilities:
              inputs: [text]
              outputs: [text]
          # The decision surface: the maintenance arbiter asks one choice
          # question per candidate pair ("does the newer statement make the
          # older one out of date") and reads the answers back in question
          # order. Nothing pays for it here -- `maintain.arbiter` stays out of
          # the memories block below -- but declaring it puts the name in front
          # of the catalog probe, and deploy-arbiter.yaml is the document a
          # lane that measures the arbiter builds.
          - name: azure-decision
            kind: decision
            capabilities:
              inputs: [text]
      profiles:
        - secrets:
            api_key: ${env:GATEWAY_API_KEY}

  infer:
    kind: inference.Assembly
    impl: unified
    deps:
      provider.gateway: gateway
      provider.bytedance: bytedance

  # Embeddings for the vector lane. The generate surface has no embedding
  # route, so the vector lane is doubao-embedding-vision through the Ark
  # driver: the memory vector lane passes text and image parts through, and
  # the model fuses them into one vector per item — one HTTP request per item,
  # since the multimodal route does not batch. The driver is the same one Ark
  # is reached with; base_url is what changes, because the gateway publishes
  # the same route under /v1.
  #
  # Verified against the gateway: POST /v1/embeddings/multimodal answers a
  # single 2048-dimension float vector for one item, the name is served
  # undated (no -251215 snapshot, so no endpoint pin), and /v1/embeddings —
  # the text route this model does not use — answers 403 for every name. The
  # route publishes no dimensions parameter, so custom_embed_dimensions is
  # stated off rather than inherited from Ark's.
  bytedance:
    kind: inference.Provider
    impl: bytedance
    settings:
      id: bytedance
      spec:
        base_url: https://ai.haivivi.cn/v1
        models:
          - name: doubao-embedding-vision
            kind: embed
            capabilities:
              inputs: [text, image]
            limits:
              max_input_tokens: 8191
      profiles:
        - secrets:
            api_key: ${env:GATEWAY_API_KEY}

  memories:
    kind: memory.Assembly
    impl: flowcraft
    deps:
      workspace: ws
      inference: infer
    settings:
      storage:
        log: {driver: workspace}
        kv: {driver: workspace}
      # Pin sampling on the derivation side. Every unpinned generate call is a
      # sample, and those samples compound: two fresh derivations of this corpus
      # under one revision wrote 3424 and 3090 facts, and that difference alone
      # moved evidence recall by 1.4pp -- larger than the effect a read-path arm
      # is asked to show. It is part of the derivation policy digest, so a
      # workspace derived without it is derived again.
      generate: {provider: gateway, name: deepseek-flash, temperature: 0}
      embed: {provider: bytedance, name: doubao-embedding-vision}
      scopes:
        - {runtime_id: memories}
      interval: "0"
      recent: {max_items: 8}
      # Derive conversations four at a time. The worker fans out over the
      # conversations that have pending commits, so this only pays off together
      # with -prepare-all (a per-scenario run only ever has one stream ready).
      # What a conversation derives is unchanged: it keeps its own watermark and
      # commit order, and every artifact id is content-derived.
      derive: {concurrency: 4}
      # A fact is a paraphrase, so surface details (a book title, a quoted
      # number, the exact activities of a trip) only exist in the turn it came
      # from. Pull one source message along with each fact hit so the answer
      # model sees the wording the conversation actually used.
      # What one lane keeps decoded, in bytes. The store's own budget is 2 GiB,
      # and this assembly owns three cached lanes (bm25, entity, vector), so
      # leaving it unset asks for 6 GiB of residency: measured at 7.6 GB peak
      # RSS on the hard LongMemEval variant, against a 4 GB gate. A shard is a
      # few megabytes of table, read and dropped rather than kept, so 256 MiB
      # per lane is enough -- measured at 3.0 GB peak RSS with recall and
      # answers identical to the 2 GiB runs (three runs, n=500, 474-475 hits).
      lanes:
        cache: {max_bytes: 268435456}
      retrieval: {source_quotes: 3}
