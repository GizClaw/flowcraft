version: v1
sources:
  - kind: builtin
    spec: {tools: [exec, echo]}
middlewares:
  - kind: recover
  - kind: telemetry
  - kind: audit      # outer enough to observe approval denials too
  - kind: concurrency
    spec: { limit: 10 }
  - kind: timeout
    spec: { default: 30s, per_tool: { exec: 120s } }
  - kind: ratelimit
  - kind: approval
    spec: { tools: [exec] }
scopes: { exec: platform }
