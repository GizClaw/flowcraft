  FIELD_ID_TRANSCRIPTION_INPUT_FORMAT = 88;
  FIELD_ID_TRANSCRIPTION_TIMESTAMPS = 89;
}

// Disposition is how one field fared.
enum Disposition {
  DISPOSITION_UNSPECIFIED = 0;
  DISPOSITION_NATIVE = 1;
  DISPOSITION_REJECTED = 2;
  DISPOSITION_DROPPED = 3;
}

// ComponentNote is how one component inside an aggregating field fared.
message ComponentNote {
  // The canonical content kind ("text", "image", …).
  string kind = 1;
  Disposition disposition = 2;
  // Position in encounter order.
  uint64 index = 3;
  string reason = 4;
}

// CompileDecision is one field's entry.
message CompileDecision {
  FieldId field = 1;
  Disposition disposition = 2;
  string reason = 3;
  repeated ComponentNote components = 4;
}

// CompileReport is what a compile did, field by field: the evidence that replaces a
// prepared handle. A successful compile covers every active field exactly once, as
// native or as dropped-with-a-reason.
message CompileReport {
  // The workload: "generate", "embed", "transcription", "decision".
  string operation = 1;
  repeated CompileDecision decisions = 2;
}

// ── usage ────────────────────────────────────────────────────────────────────────

// Usage is what one call cost, in the provider's own counts.
message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  // Absent means the provider did not report it, which is not the same as zero.
  optional uint64 cache_read_tokens = 4;
  optional uint64 reasoning_tokens = 5;
}

// Money is `units * 10^-scale` in `currency`.
message Money {
  string currency = 1;
  int64 units = 2;
  uint32 scale = 3;
}

// ── generate ─────────────────────────────────────────────────────────────────────

message GenerateRequest {
  Target target = 1;
  repeated flowcraft.message.v1.Message messages = 2;
  TextIntent intent = 3;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_TOOL_CALLS = 3;
  FINISH_REASON_OTHER = 4;
}

message GenerateResponse {
  repeated flowcraft.message.v1.Part parts = 1;
  FinishReason finish = 2;
  Usage usage = 3;
  CompileReport report = 4;
}

message GenerateStreamRequest {
  GenerateRequest request = 1;
}

// Started opens a stream: the caller learns which model answered before any content.
message Started {
  ModelId model = 1;
  string response_id = 2;
}

// Attempt is one routing attempt, reported as it happens. Non-terminal: the stream's
// `finish` is still the only thing that ends it.
message Attempt {
  string target = 1;
  // "preflight", "execute", "open".
  string phase = 2;
  // "selection", "retry", "fallback".
  string trigger = 3;
  // "succeeded", "failed", "opened", "skipped".
  string outcome = 4;
  // The canonical error kind, when it failed.
  string error_kind = 5;
  // Whether the caller could observe output: a streamed attempt is not retried.
  bool observable_output = 6;
  // 1-based attempt number within one target.
  uint64 number = 7;
  // Delay slept before this attempt, in milliseconds.
  uint64 backoff_millis = 8;
}

// GenerateEvent is one event of a streaming generation.
message GenerateEvent {
  oneof kind {
    Started started = 1;
    Attempt attempt = 2;
    flowcraft.message.v1.Delta delta = 3;
    // The terminal event. A stream that ends without one is a truncated provider stream.
    Finish finish = 4;
  }
}

message Finish {
  GenerateResponse response = 1;
}

// ── catalogue and explain ───────────────────────────────────────────────────────

message DescribeRequest {}

message DescribeResponse {
  // The workloads it answers ("generate", "embed", …).
  repeated string operations = 1;
  // Whether it can answer a streaming request. A caller that asked for a stream from a
  // provider without one gets `NotAvailable`, not a one-event stream.
  bool streams = 2;
  // How many models the deployment declared.
  uint64 models = 3;
}

message ModelsRequest {}

message ModelsResponse {
  repeated ModelDescriptor models = 1;
}

message ExplainRequest {
  Target target = 1;
  repeated flowcraft.message.v1.Message messages = 2;
  TextIntent intent = 3;
}

// ExplainResponse is the compile without the call: the same report `Generate` would
// produce, plus the model the target resolved to.
message ExplainResponse {
  ModelRef resolved = 1;
  CompileReport report = 2;
}
