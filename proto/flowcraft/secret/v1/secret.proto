syntax = "proto3";

package flowcraft.secret.v1;

option go_package = "github.com/GizClaw/flowcraft/core/secret/v1;secretv1";

service Secret {
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

message LookupRequest { string name = 1; }
message LookupResponse {
  string value = 1;
  bool found = 2;
}
