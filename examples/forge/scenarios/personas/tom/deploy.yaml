# A persona workspace: one agent that plays the user side of a simulated conversation. `forge test-auto`
# copies this directory and the raid's into one run, so the two never share a store or a session.
version: 1

agents:
  - name: tom
    program:
      impl: graph
      settings:
        # What a node calls when the graph names no model.
        model: {provider: openai, name: gpt-4o-mini}
        path: ${workspace:root}/graphs/persona.yaml
    limits: {idle: 30m, max_sessions: 4}