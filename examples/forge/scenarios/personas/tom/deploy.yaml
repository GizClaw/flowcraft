# A persona workspace: one agent that plays the user side of a simulated
# conversation. `forge test-auto` copies this directory and the raid's into one
# run, so the two never share a store or a session.
version: 1

agents:
  - name: tom
    engine:
      kind: graph
      settings:
        path: ${workspace:root}/graphs/persona.yaml
    runtime:
      layers:
        - priority: 0
          path: ${workspace:root}/runtime.yaml
