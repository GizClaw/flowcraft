# The substrate an agent runs on: the process boundary, the models it may call, and which tool sources
# are wired.
#
# Nothing here belongs to a conversation: history, task state and usage live in the session store, which
# is why this file is the same for every turn.
version: 1

sandbox:
  # A backend holds no directory and no policy: what a session may do comes from the agent's grant. local
  # is no OS boundary at all; a hardened deployment adds bwrap (Linux) or seatbelt (macOS) here.
  - {name: local, impl: local}

inference:
  providers:
    - name: openai
      # The impl name is what this binary compiles in; see internal/app/drivers.go.
      impl: openai
      settings:
        base_url: https://api.openai.com/v1
        # responses: the surface where per-call options exist at all. Every model node writes
        # `store: false`, and the chat surface would refuse that option rather than silently drop it.
        api: responses
        api_key: ${env:OPENAI_API_KEY}
        models:
          - id: {provider: openai, name: gpt-4o-mini}
  route:
    attempts_per_target: 2
    max_targets: 1
    base_delay: 250ms
    max_delay: 5s

# Both fields are required: "we record nothing" and "nobody said" are different facts.
observability: {trace: none, bodies: false}

tools:
  sources:
    - {name: sim, impl: sim}
    - {name: files, impl: files}
