version: 1

agents:
  # The referee owns the rules and makes no model call of its own: every line of
  # the game is spoken by a seat, reached through the delegate tool.
  - name: referee
    engine:
      kind: graph
      settings:
        path: ${workspace:root}/graphs/referee.yaml
    runtime:
      layers:
        - priority: 0
          path: ${workspace:root}/runtime.yaml
    # Sync delegation: a rule asks one seat and waits for its answer, which is
    # what a turn-based table needs. Depth and concurrency are the manager's.
    delegation:
      targets: [seat_1, seat_2, seat_3, seat_4, seat_5, seat_6, seat_7, seat_8]
      modes: [sync]
      timeout: 2m

  - name: seat_1
    engine:
      kind: graph
      settings:
        path: ${workspace:root}/graphs/seat_1.yaml
    runtime:
      layers:
        - priority: 0
          path: ${workspace:root}/runtime.yaml
    hooks:
      # The seat's memory: delegation starts a fresh child session per call,
      # so what it said before lives in the workspace, keyed by the game.
      - kind: seat-memory
        settings: {dir: .forge/memory, keep: 12}

