version: v1

resources:
  events:
    kind: event.Bus
    impl: memory
  sim:
    kind: tool.Source
    impl: sim
  tools:
    kind: tool.Assembly
    impl: memory
    deps:
      tool: sim
  ws:
    kind: workspace.Workspace
    impl: local
    settings:
      root: ./workspace
  provider:
    kind: inference.Provider
    impl: deepseek
    settings:
      id: deepseek
      spec:
        api: chat
      profiles:
        - secrets:
            api_key: ${env:DEEPSEEK_API_KEY}
  infer:
    kind: inference.Assembly
    impl: unified
    deps:
      provider: provider
  js:
    kind: agent.ScriptRuntime
    impl: js
    settings:
      pool_size: 4

agents:
  assistant:
    card:
      name: Werewolf Host
      description: A Chinese Werewolf host with a per-seat state graph and a simulated game-event tool.
    engine:
      kind: agent.Engine
      impl: graph
      deps:
        inference: infer
        tools: tools
        workspace: ws
        script_runtime: js
      settings:
        graph: {file: ./graphs/assistant.yaml}
        build:
          max_iterations: 120

runtime:
  event_bus: events
  sessions:
    idle_timeout: 10m
    sink_buffer: 256
