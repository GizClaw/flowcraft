# One substrate for the whole table: the referee and every seat share it.
#
# Seats differ by their graph (a persona prompt), not by their deployment: the process describes what
# this machine offers, and the agent document selects from it.
version: 1

# A backend holds no directory and no policy: the write set and the network posture come from the
# session's grant.
sandbox:
  - {name: local, impl: local}

inference:
  providers:
    - name: openai
      impl: openai
      settings:
        base_url: https://api.openai.com/v1
        # responses: the surface where per-call options exist at all. Every model node writes
        # `store: false`, and the chat surface would refuse that option rather than silently drop it.
        api: responses
        api_key: ${env:OPENAI_API_KEY}
        models:
          - id: {provider: openai, name: gpt-6.1-sol}
  route:
    attempts_per_target: 2
    base_delay: 250ms

# How much of a turn this process records. Both fields are required: "we record nothing" and "nobody
# said" are different facts, and the second one is how a deployment ends up with no trace at all.
observability: {trace: call, bodies: false}

tools:
  sources:
    # The table's own simulated tools, then the file set the seats read and write through.
    - {name: sim, impl: sim}
    - {name: files, impl: files}
    - {name: delegation, impl: delegation}
  middleware:
    - {name: recover, impl: recover}
    - {name: telemetry, impl: telemetry}

skills:
  roots: ["${workspace:root}/skills"]
