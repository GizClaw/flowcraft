      impl: graph
      settings:
        # What a node calls when the graph names no model.
        model: {provider: openai, name: gpt-6.1-sol}
        # Where a script node's relative path resolves: the workspace, so a rule writes `rules/x.star`
        # and means the file beside it.
        scripts: ${workspace:root}
        path: ${workspace:root}/graphs/seat_bajie.yaml
    hooks:
      - impl: seat-memory
        settings: {dir: "${workspace:root}/.forge/memory", keep: 10}

  - name: seat_monster
    limits: {idle: 30m, max_sessions: 64}
    program:
      impl: graph
      settings:
        # What a node calls when the graph names no model.
        model: {provider: openai, name: gpt-6.1-sol}
