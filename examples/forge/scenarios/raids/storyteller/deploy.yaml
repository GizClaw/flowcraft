version: 1

agents:
  # The narrator directs and speaks: one model node picks the next speaker
  # inside the list the rules allow, another writes the narration.
  - name: narrator
    program:
      impl: graph
      settings:
        # What a node calls when the graph names no model.
        model: {provider: openai, name: gpt-6.1-sol}
        # Where a script node's relative path resolves: the workspace, so a rule writes `rules/x.star`
        # and means the file beside it.
        scripts: ${workspace:root}
        path: ${workspace:root}/graphs/narrator.yaml
    limits: {idle: 30m, max_sessions: 64}
  - name: seat_wukong
    limits: {idle: 30m, max_sessions: 64}
    program:
      impl: graph
      settings:
        # What a node calls when the graph names no model.
        model: {provider: openai, name: gpt-6.1-sol}
        # Where a script node's relative path resolves: the workspace, so a rule writes `rules/x.star`
        # and means the file beside it.
        scripts: ${workspace:root}
        path: ${workspace:root}/graphs/seat_wukong.yaml
    hooks:
      # A character remembers what it said in this story, keyed by the table's
      # session so the next arc starts clean.
      - impl: seat-memory
        settings: {dir: "${workspace:root}/.forge/memory", keep: 10}

  - name: seat_tangseng
    limits: {idle: 30m, max_sessions: 64}
    program:
