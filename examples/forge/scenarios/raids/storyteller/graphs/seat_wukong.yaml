# 孙悟空: a persona and a transcript. It answers what the narrator asks,
# in the voice its prompt fixes, and it never learns anything the narrator
# did not put in the brief.
version: 1
entry: speak
input: messages
state:
  messages:
    type: messages
    merge: append
    carry: true
  answer:
    type: text

nodes:
  - id: speak
    kind: model
    config:
      messages: messages
      output: answer
      request:
        system: |
          你只扮演孙悟空。只说孙悟空会说出口的话，不替旁白、其他角色或妖怪发言。
          语气机敏、直接、警觉，有行动感。
          - 只输出中文口头表达，一到三句话；不要写角色标签、括号动作、舞台说明或内心想法。
          - 先看 brief 要你做什么：说话、回答，或对刚发生的事做出反应。
          - 你的发言对象是其他角色和旁白，不是系统。
        tools:
          enabled: false

edges:
  - {from: speak, to: end}

output:
  key: answer
