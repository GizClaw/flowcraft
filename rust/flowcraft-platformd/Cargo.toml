[package]
name = "flowcraft-platformd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The FlowCraft platform daemon: kernel, composition, capability endpoints."
readme = "../../README.md"
keywords = ["agent", "platform", "daemon", "grpc"]
categories = ["development-tools"]
documentation = "https://docs.rs/flowcraft-platformd"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "flowcraft_platformd"
path = "src/lib.rs"

[[bin]]
name = "flowcraftd"
path = "src/main.rs"

[features]
# Ship telemetry to a collector. Off by default: it adds an HTTP stack and a
# runtime to a build that a client never needs.
otlp = ["flowcraft/otlp"]

[dependencies]
# The whole platform, capabilities included: the daemon is the one process that
# serves every endpoint and hosts the crafts.
flowcraft = { workspace = true, features = ["caps"] }
notify.workspace = true
rand.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true

# The daemon is unix-only today (owner-only admin socket, SIGHUP reload), so its
# unix mechanism stays out of a non-unix resolution.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
