# The Rust workspace. Today it holds one thing: the conformance probe, whose
# job is to reproduce core's observable YAML behaviour byte for byte against
# the Go oracle (rust/conformance/README.md). The port's own crates grow here
# as they land, split by dependency direction rather than by Go package.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/GizClaw/flowcraft"

[workspace.dependencies]
serde_json = "1.0.154"
serde_norway = "0.9.42"
serde_yaml_ng = "0.10.0"
saphyr = "0.2.2"

# Production posture, for the crates that ship. The probe does not inherit it
# yet: it is a measurement binary, not a shipped crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
future_not_send = "warn"
