# The Rust workspace: the port's crates, plus the probe that checks them
# (rust/conformance/README.md). Crates are split by dependency direction
# rather than by Go package, and a crate that ships inherits the lints below.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/GizClaw/flowcraft"

[workspace.dependencies]
base64 = "0.22.1"
# core's `workspace.LocalWorkspace` pins its root with `os.Root`: a directory
# handle, and per-component symlink containment, so there is no check-then-use
# window to race. `cap-std`'s `Dir` is that primitive (openat/`openat2` beneath
# the handle, on Windows the same rules), and it stays an *implementation
# detail* of the local backend -- the port's `Workspace` trait is path-based, so
# adopting it does not reshape the API (`docs/plans/2026-10-15-rust-core-port.md`
# §4.14).
cap-std = "4.0"
# Host normalization is IDNA (UTS #46), and core uses golang.org/x/net's
# Lookup profile. The options below are chosen to be that profile: STD3 rules,
# hyphen positions checked, non-transitional, no DNS length limit. Writing the
# UTS #46 mapping tables by hand would be a larger artifact than the crate and
# worse at it.
idna = "1.1.0"
saphyr = "0.2.2"
saphyr-parser = "0.2.2"
serde = { version = "1.0.228", default-features = false, features = ["std"] }
# `raw_value` is what lets a decoder keep a sub-document's exact text -- the
# bytes a caller wrote, not a re-rendering of them. The wire codecs need it:
# a tool call's arguments and a data part's value ride through unparsed.
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_norway = "0.9.42"
serde_yaml_ng = "0.10.0"
# A hook group's `matcher` is a regular expression, and core compiles it with Go's
# `regexp` -- RE2. `regex` is the same family: no backreferences, no lookaround,
# linear time. That matters for more than speed here: a matcher is user input in
# a file, and a backtracking engine would let one pattern hang a run. The two
# engines' *error text* differs, which is why the contract masks a bad pattern's
# tail instead of pretending to compare it.
regex = "1.13"
# `kill(-pid, SIGKILL)` without the `unsafe` block `libc` needs: a timed-out hook
# is one process group, and `sh -c` puts the work a level down from the shell.
rustix = { version = "1.1", features = ["process"] }
# bm25's tokenizer asks two questions of every character -- is it a letter, is
# it a digit -- and both are Unicode *general categories* (L*, Nd), not the
# `Alphabetic` property Rust's `char` exposes. core asks the category, so the
# port does too; a data-only crate is smaller than the table it replaces.
unicode-general-category = "1.1.0"
# The runtime the port chose (plan §6): the bus's backpressure is a pending
# future, not a parked thread, and cancellation is a token rather than a
# context. `sync` alone is enough for the bus; `rt`/`macros`/`time` are for its
# tests, and land here so every crate measures against the same version.
# `net` is the listener the egress proxy binds (a unix socket for the bwrap
# bridge, an ephemeral loopback port for seatbelt), and `io-util` is the
# split/copy the tunnel is made of -- the port has no `net.Listen` to fall back
# on, so these two are part of the runtime choice rather than extras.
tokio = { version = "1.53.3", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

# The MITM slice's TLS stack, chosen in docs/plans/2026-10-15-rust-core-port.md
# §4.6. `ring` rather than rustls' default `aws-lc-rs`: the latter builds a C
# library through cmake, and the port wants one provider on both sides of a
# handshake rather than a second build system. `rcgen` signs with the same
# provider, so what rustls verifies is what rcgen minted.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# `rcgen` takes its validity window as a `time::OffsetDateTime`, and core's
# window is a stated constant rather than a default.
time = { version = "0.3", default-features = false, features = ["std"] }

# The MITM engine's HTTP (plan §4.6). Both roles and both protocols are on
# because a terminated tunnel serves h1 and h2 to the client -- whichever ALPN
# picked -- and always h1 upstream, which is core's `dialTLS` without
# `NextProtos`. `hyper-util` is here for two adapters only: `TokioIo` bridges
# tokio's `AsyncRead`/`AsyncWrite` to hyper's runtime traits, and `TokioTimer`
# is what `header_read_timeout` needs in order to exist at all.
hyper = { version = "1.12", default-features = false, features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The transparent gzip half of core's outbound transport: `net/http` adds
# `accept-encoding: gzip` to a request that asked for no encoding, and decodes
# precisely what it asked for. Go has `gzip.NewReader(http.Response.Body)` and
# gets a streaming decoder for free; the port's body is a `Stream`, so the
# decoder has to be one too -- `flate2`'s is `Read`, which would mean buffering
# a whole response in memory to hand it to it.
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"] }

# Baselines, not gates. `bm25` is the one piece whose cost is a stated property
# of the design ("a few hundred to a few thousand short documents"), so it gets a
# harness that can answer "did this get slower" with a number. The default
# features are narrowed to what a baseline needs: the plotting half pulls in
# `plotters` for HTML nobody commits, and `rayon` would let one measurement run
# on several threads and hide the per-query cost the question is about.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Production posture, for the crates that ship. The probe does not inherit it:
# it is a measurement binary, not a shipped crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
future_not_send = "warn"
