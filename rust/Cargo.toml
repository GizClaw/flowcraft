# The Rust workspace: the port's crates, plus the probe that checks them
# (rust/conformance/README.md). Crates are split by dependency direction
# rather than by Go package, and a crate that ships inherits the lints below.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/GizClaw/flowcraft"

[workspace.dependencies]
base64 = "0.22.1"
saphyr = "0.2.2"
saphyr-parser = "0.2.2"
serde_json = "1.0.154"
serde_norway = "0.9.42"
serde_yaml_ng = "0.10.0"

# Production posture, for the crates that ship. The probe does not inherit it:
# it is a measurement binary, not a shipped crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
future_not_send = "warn"
