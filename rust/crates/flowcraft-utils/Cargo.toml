[package]
name = "flowcraft-utils"
description = "The port's utility layer, mirroring core/utils."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Unpublished, like every crate here: the port has no release yet.
publish = false

[dependencies]
flowcraft-contract = { path = "../flowcraft-contract" }
base64.workspace = true
idna.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
serde_json.workspace = true
unicode-general-category.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
time = { workspace = true }
# The MITM engine's HTTP and TLS: hyper for both roles, `tokio-rustls` for the
# terminated tunnel, and `async-compression` for the gzip half of core's
# outbound transport. See the workspace manifest for why each one is here.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tokio-rustls = { workspace = true }
async-compression = { workspace = true }

[lints]
workspace = true
