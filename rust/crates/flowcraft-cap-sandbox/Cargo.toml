[package]
name = "flowcraft-cap-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FlowCraft sandbox capability: local process runner, endpoint server, remote client."

[dependencies]
flowcraft-error.workspace = true
flowcraft-client.workspace = true
flowcraft-kernel.workspace = true
flowcraft-proto.workspace = true
flowcraft-resource.workspace = true
async-trait.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
notify.workspace = true
tonic.workspace = true
tracing.workspace = true

# cgroups are a Linux-only mechanism; everything else compiles without it and
# reports the caps as unavailable.
[target.'cfg(unix)'.dependencies]
# A pty needs `setsid` + `TIOCSCTTY`, which are `unsafe` and this workspace
# forbids `unsafe_code` outright (`forbid` cannot be relaxed by an inner
# `allow`), so the mechanism comes from a dependency.
portable-pty.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cgroups-rs.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
