[package]
name = "flowcraft-platformd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The FlowCraft platform daemon: kernel, composition, capability endpoints."

[lib]
name = "flowcraft_platformd"
path = "src/lib.rs"

[[bin]]
name = "flowcraftd"
path = "src/main.rs"

[features]
# Ship telemetry to a collector. Off by default: it adds an HTTP stack and a
# runtime to a build that a client never needs.
otlp = ["flowcraft-telemetry/otlp"]

[dependencies]
flowcraft-cap-sandbox.workspace = true
flowcraft-cap-tool.workspace = true
flowcraft-cap-secret.workspace = true
flowcraft-cap-workspace.workspace = true
flowcraft-error.workspace = true
flowcraft-client.workspace = true
flowcraft-kernel.workspace = true
flowcraft-telemetry.workspace = true
flowcraft-proto.workspace = true
flowcraft-resource.workspace = true
nix = { workspace = true, features = ["user"] }
notify.workspace = true
rand.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
