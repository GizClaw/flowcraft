[package]
name = "flowcraft-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FlowCraft telemetry pipeline: field vocabulary, rendering, sinks, and the subscriber host."

[features]
default = ["otel"]
# Trace context from the OpenTelemetry SDK: ids, spans and `traceparent`. Off
# means no trace ids at all — deliberately not a home-grown substitute.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# The OTLP exporter: a network client, and therefore a runtime. Cloud builds
# only.
otlp = [
    "otel",
    "opentelemetry_sdk/rt-tokio",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tokio",
]

[dependencies]
flowcraft-error.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
