# A graph document with a loop: model -> tools -> model, ending when the model
# stops asking for a tool. Edges carry the conditions, so the loop is explicit
# instead of being implied by node types.
version: 1
name: react
entry: model
input: messages

limits:
  max_steps: 16
  max_nodes: 64
  timeout: 5m

checkpoint:
  # Also write a base every N steps, so a restart replays at most that much.
  every: 8

state:
  # A write of the same key twice in one step is an error unless `merge` says how
  # to combine them; the tool node appends only the results it produced.
  messages: {type: messages, merge: append, carry: true}
  pending: {type: json}
  answer: {type: text}

nodes:
  - id: model
    kind: model
    config:
      messages: messages
      pending: pending
      output: answer
      request:
        model: {provider: luna, name: gpt-5}
        system: Use the file tools when they help; answer when you are done.
        # The projection the model may call: names the session's grant allows.
        tools: {names: [read_file, write_file]}
  - id: tools
    kind: tool
    config:
      messages: messages
      pending: pending
      parallelism: 4

edges:
  # A pending list means the model asked for tools: run them, then answer again
  # with their results in the transcript. `end` is the reserved finish target.
  - {from: model, to: tools, when: "len(pending) > 0"}
  - {from: tools, to: model}
  - {from: model, to: end, when: "len(pending) == 0"}

output:
  key: answer
