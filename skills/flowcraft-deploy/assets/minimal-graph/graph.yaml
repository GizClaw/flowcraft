# A graph document with a loop: model → tools → model, ending when the model
# stops asking for a tool. Edges carry the conditions, so the loop is explicit
# instead of being implied by node types.
version: 1
name: react
entry: model
input: messages

limits:
  max_steps: 16
  max_nodes: 64
  timeout: 5m

checkpoint:
  every: 8

state:
  messages: {type: messages, merge: append, carry: true}
  pending: {type: json}
  answer: {type: text}

nodes:
  - id: model
    kind: model
    config:
      messages: messages
      pending: pending
      output: answer
      request:
        model: {provider: luna, name: gpt-5}
        system: Use the file tools when they help; answer when you are done.
        tools: {names: [read_file, write_file]}
  - id: tools
    kind: tool
    config:
      messages: messages
      pending: pending
      parallelism: 4

edges:
  - {from: model, to: tools, when: "len(pending) > 0"}
  - {from: tools, to: model}
  - {from: model, to: END, when: "len(pending) == 0"}

output:
  key: answer
