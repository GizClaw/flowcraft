interface:
  display_name: "FlowCraft Deployment Authoring"
  short_description: "Write, validate, and debug FlowCraft deployments"
  default_prompt: >-
    Use $flowcraft-deploy to write a complete FlowCraft deployment — the process
    document (sandbox backends, providers and models, tool sources, skill roots,
    observability) and the agent document (agents, each with a program, a grant
    and hooks) — plus the graph document a program of kind graph executes, then
    check it against the field tables.
