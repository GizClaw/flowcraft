version: v1

resources:
  events:
    kind: event.Bus
    impl: memory
    settings:
      route_cache_size: 1024

  ws:
    kind: workspace.Workspace
    impl: local
    settings:
      file: ./workspace.yaml

  provider:
    kind: inference.Provider
    impl: deepseek
    settings:
      file: ./inference.yaml

  infer:
    kind: inference.Assembly
    impl: unified
    deps:
      provider: provider

agents:
  assistant:
    card:
      name: Assistant
      description: Handles interactive requests with memory.
    engine:
      kind: agent.Engine
      impl: graph
      deps:
        inference: infer
        workspace: ws
      settings:
        graph: {file: ./graphs/assistant.json}

runtime:
  event_bus: events
  sessions:
    idle_timeout: 10m
    sink_buffer: 256
