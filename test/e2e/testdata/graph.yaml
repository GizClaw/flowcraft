# A graph a whole stack runs: the model asks for one file tool, the tool node runs
# it, and the model answers. It is deliberately the smallest document that still
# crosses every seam — a model call, a tool call through the chain, a checkpoint,
# and an answer — because the test's subject is the wiring and not the engine.
version: 1
name: writer
entry: model
input: messages

limits:
  max_steps: 8
  max_nodes: 16
  timeout: 1m

checkpoint:
  every: 1

state:
  messages: {type: messages, merge: append, carry: true}
  pending: {type: json}
  answer: {type: text}

nodes:
  - id: model
    kind: model
    config:
      messages: messages
      pending: pending
      output: answer
      request:
        model: {provider: fake, name: fake-1}
        system: Write the note the user asked for, then answer.
        tools: {names: [write_file]}
  - id: tools
    kind: tool
    config:
      messages: messages
      pending: pending
      parallelism: 1

edges:
  - {from: model, to: tools, when: "len(state.pending) > 0"}
  - {from: tools, to: model}
  - {from: model, to: end, when: "len(state.pending) == 0"}

output:
  key: answer
