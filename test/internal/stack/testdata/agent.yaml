# The agent: one program and the session table it runs under.
#
# It says nothing about what a session may do: authority belongs to the caller and is stated
# when the conversation is opened (see authority in stack.go). The write set that caller
# names is the one the backend has to enforce, and sandbox/local declares no filesystem
# bounds — so the stack opens sessions with an unrestricted write set.
version: 1
agents:
  - name: writer
    program:
      impl: graph
      settings:
        path: "<graph>"
    limits: { idle: 5m, max_sessions: 4 }
