# golangci-lint configuration (schema v2).
#
# CI scope today: sdk, sdkx (see .github/workflows/ci.yml).
# examples/forge and tools/releasegate are intentionally not gated yet.
#
# The enabled set mirrors golangci-lint's "standard" linters, made explicit so
# future additions are deliberate changes.
version: "2"

run:
  timeout: 5m

issues:
  # Report every finding; do not cap per-linter or per-message counts
  # (defaults hide issues after the first few identical messages).
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
