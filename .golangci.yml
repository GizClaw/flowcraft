# golangci-lint configuration (schema v2).
#
# CI scope: the in-workspace modules except examples/forge (core, craft,
# examples/anvil, backends/*, driver) — see .github/workflows/ci.yml.
# examples/forge pins released versions and tools/releasegate stays out of
# the gate.
#
# The enabled set mirrors golangci-lint's "standard" linters, made explicit so
# future additions are deliberate changes. errorlint is the one addition beyond
# that set: error wrapping is a contract here — a caller routes on
# errors.Is / errors.As — so a `==` comparison, a bare type assertion, or a
# non-wrapping %v on an error is a defect rather than a style choice.
version: "2"

run:
  timeout: 5m

issues:
  # Report every finding; do not cap per-linter or per-message counts
  # (defaults hide issues after the first few identical messages).
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - gocyclo

  settings:
    gocyclo:
      # Cyclomatic-complexity ratchet. A function should be one level of
      # abstraction the reader can hold in one screenful; 20 is the target the
      # Go review set for this repo, and 40 is where a function stops being
      # reviewable at all, so 40 is the hard floor enforced here. The
      # functions still above it are the baseline listed in
      # linters.exclusions.rules — that list may only shrink, and winning
      # there means lowering this number, never adding an entry.
      #
      min-complexity: 40

    depguard:
      rules:
        # core/inference/model holds the model declaration vocabulary and
        # depends only on core/message and the leaf core/utils/ptr, never on
        # the inference contract that re-exports it. An import in this
        # direction would be a cycle — and, more importantly, would mean the
        # vocabulary had grown a dependency on the runtime it describes.
        model-is-a-leaf:
          files:
            - "**/core/inference/model/**"
          deny:
            # The trailing $ makes the match exact: without it depguard treats
            # the value as a prefix and also denies the sibling leaves
            # (core/inference/usage, core/inference/model) that depend on it.
            - pkg: "github.com/GizClaw/flowcraft/core/inference$"
              desc: "core/inference/model must not import the inference contract"
        # inference/usage is the accounting vocabulary a host names without
        # taking on the inference runtime: core/agent depends on it, and that
        # dependency only stays leaf-shaped if nothing here reaches back into
        # the contract it describes.
        usage-is-a-leaf:
          files:
            - "**/core/inference/usage/**"
          deny:
            # Exact match, so importing the model leaf stays legal.
            - pkg: "github.com/GizClaw/flowcraft/core/inference$"
              desc: "core/inference/usage must not import the inference contract"

  exclusions:
    # gocyclo baseline: the functions still above min-complexity today. Each
    # entry is known debt, not a pattern to copy — gocyclo reports a position
    # rather than a symbol, so an entry exempts the whole file. Split the file
    # and delete its entry; never add one for new code.
    rules:
      # Test files keep their own budget: a fixture builder, a table or a
      # conformance suite that enumerates every entry point is long by nature,
      # and a short test with a clear failure message beats an artificially
      # split one.
      - linters: [gocyclo]
        path: "_test\\.go"
      - linters: [gocyclo]
        path: "agent/agenttest/checkpoint_store_suite\\.go"
      - linters: [gocyclo]
        path: "memory/eval/cmd/memory-eval/main\\.go"
      - linters: [gocyclo]
        path: "memory/retrieval/provider\\.go"
      - linters: [gocyclo]
        path: "memory/settings\\.go"
      - linters: [gocyclo]
        path: "memory/factory\\.go"
      - linters: [gocyclo]
        path: "memory/retrieval/fusion/fusion\\.go"
      - linters: [gocyclo]
        path: "openai/spec\\.go"
      - linters: [gocyclo]
        path: "bytedance/video\\.go"
      - linters: [gocyclo]
        path: "dashscope/video\\.go"
      - linters: [gocyclo]
        path: "dashscope/model\\.go"
      - linters: [gocyclo]
        path: "craft/hostmcp/hostmcp\\.go"
