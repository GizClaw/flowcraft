# golangci-lint configuration (schema v2).
#
# CI scope today: sdk, sdkx (see .github/workflows/ci.yml).
# examples/forge and tools/releasegate are intentionally not gated yet.
#
# The enabled set mirrors golangci-lint's "standard" linters, made explicit so
# future additions are deliberate changes.
version: "2"

run:
  timeout: 5m

issues:
  # Report every finding; do not cap per-linter or per-message counts
  # (defaults hide issues after the first few identical messages).
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard

  settings:
    depguard:
      rules:
        # core/inference/model holds the model declaration vocabulary and
        # depends only on core/message and the leaf core/utils/ptr, never on
        # the inference contract that re-exports it. An import in this
        # direction would be a cycle — and, more importantly, would mean the
        # vocabulary had grown a dependency on the runtime it describes.
        model-is-a-leaf:
          files:
            - "**/core/inference/model/**"
          deny:
            - pkg: "github.com/GizClaw/flowcraft/core/inference"
              desc: "core/inference/model must not import the inference contract"
